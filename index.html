<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mark's Crypto Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mark's Portfolio</h1>
    <p>Crypto investor & enthusiast</p>
  </header>

  <section class="about">
    <h2>About Me</h2>
    <p>Hi! I'm Mark. Welcome to my personal portfolio where I track my crypto assets live from Google Sheets.</p>
  </section>

  <section class="portfolio">
    <h2>My Crypto Portfolio</h2>
    <div id="cryptoData">
      <p>Loading data...</p>
    </div>
  </section>

  <footer>
    <p>Contact me at wakitv89@gmail.com</p>
  </footer>

  <script>
    // Google Sheets API URL setup
    const sheetId = '1Plywb7kmzQ8adg0EpmP2-c9IdQc68m5fEcs0smk0mos';
    const sheetName = 'Holdings Summary';  // Sheet name
    const apiUrl = https://opensheet.elk.sh/${sheetId}/${encodeURIComponent(sheetName)};

    // Fetch data from Google Sheets using OpenSheet API
    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(HTTP error! status: ${response.status});
        }
        return response.json();
      })
      .then(data => {
        const cryptoDataDiv = document.querySelector('#cryptoData');
        cryptoDataDiv.innerHTML = ''; // Clear loading text

        // Loop through the data and create divs for E1 column data
        data.forEach(row => {
          const div = document.createElement('div');
          // Assuming E1 column is the specific column you need, adjust accordingly
          div.innerHTML = row['E1'] || 'No data available';
          cryptoDataDiv.appendChild(div);
        });
      })
      .catch(error => {
        console.error('Fetch error:', error);
        document.querySelector('#cryptoData').innerHTML = 'Failed to load data.';
      });
  </script>
</body>
</html>
