<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mark's Crypto Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mark's Portfolio</h1>
    <p>Crypto investor & enthusiast</p>
  </header>

  <section class="about">
    <h2>About Me</h2>
    <p>Hi! I'm Mark. Welcome to my personal portfolio where I track my crypto assets live from Google Sheets.</p>
  </section>

  <section class="portfolio">
    <h2>My Crypto Portfolio</h2>
    <table id="cryptoTable">
      <thead>
        <tr><th>Coin Name</th><th>Quantity</th><th>Value (PHP)</th></tr>
      </thead>
      <tbody>
        <tr id="loadingRow"><td colspan="3">Loading data...</td></tr>
      </tbody>
    </table>
  </section>

  <footer>
    <p>Contact me at wakitv89@gmail.com</p>
  </footer>

  <script>
    // Google Sheets API URL setup
    const sheetId = '1Plywb7kmzQ8adg0EpmP2-c9IdQc68m5fEcs0smk0mos';
    const sheetName = 'Holdings Summary';  // Updated sheet name
    const apiUrl = https://opensheet.elk.sh/${sheetId}/${encodeURIComponent(sheetName)};

    // Fetch data from Google Sheets using OpenSheet API
    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(HTTP error! status: ${response.status});
        }
        return response.json();
      })
      .then(data => {
        const tbody = document.querySelector('#cryptoTable tbody');
        tbody.innerHTML = ''; // Clear the loading row

        // Loop through the data and create table rows
        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row['Coin Name']}</td>
            <td>${row['Quantity']}</td>
            <td>${row['Value (PHP)']}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(error => {
        console.error('Fetch error:', error);
        document.querySelector('#cryptoTable tbody').innerHTML =
          '<tr><td colspan="3">Failed to load data.</td></tr>';
      });
  </script>
</body>
</html>
