<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mark's Crypto Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mark's Portfolio</h1>
    <p>Crypto investor & enthusiast</p>
  </header>

  <section class="about">
    <h2>About Me</h2>
    <p>Hi! I'm Mark. Welcome to my editable crypto portfolio. You can update your assets directly on this page!</p>
  </section>

  <section class="portfolio">
    <h2>My Crypto Holdings</h2>
    <div class="table-container">
      <table id="portfolioTable">
        <thead>
          <tr>
            <th>Coin</th>
            <th>Quantity</th>
            <th>Market Value (PHP)</th>
            <th>Avg. Price per Coin</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button onclick="addRow()">Add Asset</button>
      <button onclick="saveTable()">Save</button>
      <button onclick="clearTable()">Clear</button>
    </div>
  </section>

  <footer>
    <p>Contact me at wakitv89@gmail.com</p>
  </footer>

  <script>
    function loadTable() {
      const saved = localStorage.getItem('portfolioData');
      const tableBody = document.querySelector('#portfolioTable tbody');
      tableBody.innerHTML = '';

      if (saved) {
        const data = JSON.parse(saved);
        data.forEach(row => {
          insertRow(row.coin, row.quantity, row.value);
        });
      } else {
        insertRow('BTC', '0.005', '18000');
        insertRow('BTC', '0.010', '32000');
        insertRow('ETH', '0.2', '15000');
      }
      updateAverages();
    }

    function insertRow(coin = '', quantity = '', value = '') {
      const tableBody = document.querySelector('#portfolioTable tbody');
      const row = document.createElement('tr');

      row.innerHTML = `
        <td contenteditable="true" oninput="updateAverages()">${coin}</td>
        <td contenteditable="true" oninput="updateAverages()">${quantity}</td>
        <td contenteditable="true" oninput="updateAverages()">${value}</td>
        <td class="avg-price">0.00</td>
        <td><button onclick="deleteRow(this)">Delete</button></td>
      `;
      tableBody.appendChild(row);
    }

    function addRow() {
      insertRow();
    }

    function deleteRow(btn) {
      btn.closest('tr').remove();
      updateAverages();
      saveTable();
    }

    function updateAverages() {
      const rows = document.querySelectorAll('#portfolioTable tbody tr');
      const coinData = {};

      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        const coin = cells[0].innerText.trim().toUpperCase();
        const quantity = parseFloat(cells[1].innerText.trim());
        const value = parseFloat(cells[2].innerText.trim());

        if (!coinData[coin]) {
          coinData[coin] = { totalQty: 0, totalVal: 0 };
        }

        if (!isNaN(quantity) && !isNaN(value)) {
          coinData[coin].totalQty += quantity;
          coinData[coin].totalVal += value;
        }
      });

      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        const coin = cells[0].innerText.trim().toUpperCase();
        const data = coinData[coin];

        const avgCell = row.querySelector('.avg-price');
        if (data.totalQty > 0) {
          const avgPrice = data.totalVal / data.totalQty;
          avgCell.textContent = avgPrice.toFixed(2);
        } else {
          avgCell.textContent = 'N/A';
        }
      });
    }

    function saveTable() {
      const rows = document.querySelectorAll('#portfolioTable tbody tr');
      const data = [];

      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        data.push({
          coin: cells[0].innerText.trim(),
          quantity: cells[1].innerText.trim(),
          value: cells[2].innerText.trim()
        });
      });

      localStorage.setItem('portfolioData', JSON.stringify(data));
      alert('Portfolio saved!');
    }

    function clearTable() {
      if (confirm('Are you sure you want to clear all data?')) {
        localStorage.removeItem('portfolioData');
        loadTable();
      }
    }

    window.onload = loadTable;
  </script>
</body>
</html>
