<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Portfolio</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('holdings')">Holdings Summary</button>
    <button class="tab-btn" onclick="showTab('history')">Sell History</button>
  </div>

  <div id="holdings" class="tab-content active">
    <h2>Crypto Portfolio</h2>
    <table id="portfolioTable">
      <thead>
        <tr>
          <th>Coin</th>
          <th>Quantity</th>
          <th>Market Value</th>
          <th>Average Price</th>
          <th>Total Cost</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="portfolioBody"></tbody>
    </table>
    <button onclick="addRow()">Add Coin</button>
  </div>

  <div id="history" class="tab-content">
    <h2>Sell History</h2>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Coin</th>
          <th>Quantity Sold</th>
          <th>Sell Price</th>
          <th>Total Amount</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
